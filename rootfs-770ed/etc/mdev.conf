# mdev device-node rules (BusyBox mdev).
# Only two low-risk things: readable permissions for input devices, and a fixed
# group for the sound nodes.
input/.*	root:root 0644
mice		0:0 0644
snd/.*		0:0 0660
# Older configs refer to the mouse as /dev/mouse (usually a symlink to
# /dev/psaux). Provide a compatible symlink so 1990s XF86Config files and old
# games just work. mdev syntax: <dev> <user:group> <mode> =<symlink>
psaux		0:0 0644 =mouse

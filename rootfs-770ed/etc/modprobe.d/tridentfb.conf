# Trident Cyber9397（770ED 的 4 MB SGRAM 显示控制器）
#
# fp=1：走内置平板（LCD）路径。外接 VGA 显示器时改成 crt=1。
# mode：面板原生 1024x768，16bpp（4 MB 显存下够 1024x768x16M 的调色板模式；
#       32bpp 会落在 8 MB 才舒服的带宽上，770ED 只有 4 MB）。
# 若驱动报的显存不对（说 8 MB 之类），用 memsize=4096 / memdiff=<KB> 修正。
options tridentfb mode=1024x768-16@60 fp=1

# 加速器在 9397 上默认开启。如果出现花屏，先加 noaccel=1 做二分。

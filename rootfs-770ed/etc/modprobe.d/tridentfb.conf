# Trident Cyber9397 (the 4 MB SGRAM display controller in the 770ED)
#
# fp=1: use the internal flat panel (LCD) path. For an external VGA monitor
#       use crt=1 instead.
# mode: 1024x768 is the panel's native mode at 16bpp (4 MB of video memory is
#       enough for 1024x768; 32bpp wants the bandwidth of 8 MB and the 770ED
#       only has 4 MB).
# If the driver reports the wrong memory size (e.g. says 8 MB), correct it with
# memsize=4096 / memdiff=<KB>.
options tridentfb mode=1024x768-16@60 fp=1

# Acceleration is enabled by default on the 9397. If you see corrupted output,
# bisect by adding noaccel=1 first.

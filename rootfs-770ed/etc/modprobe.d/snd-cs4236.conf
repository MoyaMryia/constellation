# Crystal CS4237B（770ED 板载 ISA 音频）
#
# 默认让驱动自己探测：先 PnP BIOS（CSC0000/CSC0100），再 ISA PnP。
# 探测路径需要内核 CONFIG_PNP/PNPBIOS/ISAPNP（本风味三个都开）。
options snd-cs4236 index=0

# 如果 BIOS 把音频关掉、或 PnP 表里根本没有它，用显式资源代替上面那行：
# options snd-cs4236 index=0 isapnp=0 port=0x530 irq=5 dma1=1 dma2=0
#
# 资源怎么查：`cat /sys/bus/pnp/devices/*/resources`（PnP 可见时），
# 或参考 PS2.EXE 的音频设置页。改完 `modprobe -r snd-cs4236` 再 modprobe。

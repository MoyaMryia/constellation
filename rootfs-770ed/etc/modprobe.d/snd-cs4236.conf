# Crystal CS4237B (on-board ISA audio of the 770ED)
#
# By default the driver probes for itself: PnP BIOS (CSC0000/CSC0100) first,
# then ISA PnP. These probe paths need CONFIG_PNP/PNPBIOS/ISAPNP enabled in the
# kernel (this flavor has all three).
options snd-cs4236 index=0

# If the BIOS has audio disabled, or the PnP table does not list the chip,
# replace the line above with explicit resources:
# options snd-cs4236 index=0 isapnp=0 port=0x530 irq=5 dma1=1 dma2=0
#
# How to find the resources: `cat /sys/bus/pnp/devices/*/resources` (when PnP
# exposes them) or the audio page of PS2.EXE. After editing, run
# `modprobe -r snd-cs4236` and load it again.

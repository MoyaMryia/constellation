# Broadcom BCM4318 (BUFFALO WLI-CB-AMG54HP) -- WPA/WPA2 disconnects right
# after association.
#
# Symptom it fixes: the kernel logs "authenticated / associated / RX AssocResp
# status=0", then immediately "deauthenticating ... by local choice (Reason:
# 1=UNSPECIFIED)". The 4-way handshake never completes, so the link comes up
# with NO-CARRIER and DHCP then fails as a consequence, not as the cause.
#
# b43 hands WPA crypto to the card's on-chip engine. On BCM4318 (and 4311/4306)
# that engine mishandles the key material often enough that the handshake
# fails. nohwcrypt=1 makes the driver keep encryption in software, which is
# slower on a 266 MHz machine but correct.
#
# If WPA still fails with this set, the remaining suspects are, in order: a
# wrong passphrase (check with `wpa_passphrase SSID PASSPHRASE`), an access
# point that requires WPA3/SAE or 802.11w (PMF), neither of which this driver
# can do.
#
# The option only takes effect at module load, so after editing run:
#   modprobe -r b43 && modprobe b43
options b43 nohwcrypt=1

# IBM MWave 3780i DSP (built-in 56K software modem / voice DSP of the 770ED)
#
# Not loaded at boot: this DSP's resources (IRQ/IO/serial port) must first be
# assigned by the BIOS-side ThinkPad configuration utility and stored in CMOS,
# otherwise probing fails. Having installed the Windows driver once is taken as
# "already assigned".
#
# Manual load example (adjust resources to the actual BIOS values):
#   modprobe mwave mwave_3780i_irq=11 mwave_3780i_io=0x0130 \
#                  mwave_uart_irq=3 mwave_uart_io=0x2f8
# Device node: mknod --mode=660 /dev/modems/mwave c 10 219
# User-space dialing needs mwavem/pppd (not shipped in this image; future work).

# IBM MWave 3780i DSP（770ED 内置 56K 软猫／语音 DSP）
#
# 不随开机自动加载：这个 DSP 的资源（IRQ/IO/串口）必须先由 BIOS 侧的
# ThinkPad 配置工具分配好并写进 CMOS，否则 probe 会失败。出厂时装过一次
# Windows 驱动即视为"分配过"。
#
# 手动加载示例（资源按 BIOS 里的实际值改）：
#   modprobe mwave mwave_3780i_irq=11 mwave_3780i_io=0x0130 \
#                  mwave_uart_irq=3 mwave_uart_io=0x2f8
# 设备节点：mknod --mode=660 /dev/modems/mwave c 10 219
# 用户态拨号需要 mwavem/pppd（本镜像不含，属于后续工作）。
